{{- range .Values.testImages }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" (include "aikido-container-scan-test.fullname" $) .name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "aikido-container-scan-test.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ .name }}
    spec:
      containers:
        - name: {{ .name }}
          image: "{{ .repository }}:{{ .tag }}"
          imagePullPolicy: {{ default $.Values.image.pullPolicy .pullPolicy }}
          ports:
            - name: app
              containerPort: {{ .containerPort }}
              protocol: TCP
{{- end }}
