apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aikido-container-scan-test.fullname" . }}
  labels:
    {{- include "aikido-container-scan-test.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "aikido-container-scan-test.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aikido-container-scan-test.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "aikido-container-scan-test.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
